      - "traefik.http.middlewares.geoblock-excludedpaths.plugin.geoblock.ip2location_source_geo=seed"
      - "traefik.http.middlewares.geoblock-excludedpaths.plugin.geoblock.banHtmlFilePath=/plugins-local/src/github.com/david-garcia-garcia/traefik-geoblock/geoblockban.html"
      - "traefik.http.middlewares.geoblock-excludedpaths.plugin.geoblock.allowPrivate=true"
      - "traefik.http.middlewares.geoblock-excludedpaths.plugin.geoblock.blockedCountries=US,CN,RU"
