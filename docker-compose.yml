      - "traefik.http.middlewares.geoblock-includedpaths.plugin.geoblock.defaultAllow=false"
      - "traefik.http.middlewares.geoblock-includedpaths.plugin.geoblock.countryHeader=X-Ipcountry"
      # Only /includedpaths/secure/* is a candidate for blocking
      - "traefik.http.middlewares.geoblock-includedpaths.plugin.geoblock.includedPathsRegex=^[^/]*/includedpaths/secure/.*$$"
