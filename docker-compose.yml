      - "traefik.http.middlewares.geoblock.plugin.geoblock.countryHeader=X-Ipcountry"
      - "traefik.http.middlewares.geoblock.plugin.geoblock.logLevel=DEBUG"
      - "traefik.http.middlewares.geoblock.plugin.geoblock.logFormat=JSON"
      - "traefik.http.middlewares.geoblock.plugin.geoblock.databaseSources.litezip.path=/plugins-local/src/github.com/david-garcia-garcia/traefik-geoblock/seeds/IP2LOCATION-LITE-DB1.IPV6.BIN"
      - "traefik.http.middlewares.geoblock.plugin.geoblock.banHtmlFilePath=/plugins-local/src/github.com/david-garcia-garcia/traefik-geoblock/geoblockban.html"
      - "traefik.http.middlewares.geoblock.plugin.geoblock.allowPrivate=true"
      - "traefik.http.middlewares.geoblock.plugin.geoblock.blockedCountries=US,CN,RU"
      - "traefik.http.middlewares.geoblock.plugin.geoblock.allowedCountries=DE,FR,GB"
      - "traefik.http.middlewares.geoblock.plugin.geoblock.defaultAllow=false"
      - "traefik.http.middlewares.geoblock.plugin.geoblock.databaseSources.litezip.url=https://download.ip2location.com/lite/IP2LOCATION-LITE-DB1.IPV6.BIN.ZIP"
      - "traefik.http.middlewares.geoblock.plugin.geoblock.databaseSources.litezip.databaseType=bin"
      - "traefik.http.middlewares.geoblock.plugin.geoblock.databaseSources.litezip.archive=zip"
      - "traefik.http.middlewares.geoblock.plugin.geoblock.ip2location_source_geo=litezip"
      - "traefik.http.middlewares.geoblock.plugin.geoblock.databaseAutoUpdateDir=/data/ip2database"

