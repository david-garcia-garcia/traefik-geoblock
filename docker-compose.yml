      - "traefik.http.middlewares.geoblock-excludedpaths.plugin.geoblock.defaultAllow=false"
      - "traefik.http.middlewares.geoblock-excludedpaths.plugin.geoblock.countryHeader=X-Ipcountry"
      # Exclude paths matching {host}/excludedpaths/api/.* or {host}/excludedpaths/health
      # Pattern: ^[^/]* matches any host, then /excludedpaths/(api/.*|health)
      - "traefik.http.middlewares.geoblock-excludedpaths.plugin.geoblock.excludedPathsRegex=^[^/]*/excludedpaths/(api/.*|health)$$"

